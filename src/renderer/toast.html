<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Pitaya — Dosya işlemi</title>
  <link rel="stylesheet" href="base.css">
  <style>
    html, body { overflow: hidden; }
    body { border: 1px solid var(--border); }
    #app { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .icon {
      flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent-text); font-size: 14px; font-weight: 700;
    }
    .icon.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
    .icon.error { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
    .text { flex: 1; min-width: 0; }
    .title { font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sub { font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sub.error { color: var(--danger); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .close {
      flex: none; align-self: flex-start; border: 0; background: transparent; color: var(--muted);
      width: 22px; height: 22px; border-radius: 6px; cursor: pointer;
    }
    .close:hover { background: var(--surface); color: var(--text); }
    .bar { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
    .bar[hidden], .buttons[hidden] { display: none; }
    .buttons { display: flex; gap: 6px; justify-content: flex-end; }
    .btn {
      border: 1px solid var(--border); background: var(--bg); border-radius: 7px;
      padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div class="row">
      <div id="icon" class="icon"></div>
      <div class="text">
        <div id="title" class="title"></div>
        <div id="sub" class="sub"></div>
      </div>
      <button id="close" class="close" title="Kapat">✕</button>
    </div>
    <div id="bar" class="bar" hidden><div id="fill"></div></div>
    <div id="buttons" class="buttons" hidden>
      <button id="open" class="btn">Klasörü aç</button>
      <button id="undo" class="btn">Geri al</button>
    </div>
  </div>
  <script src="toast.js"></script>
</body>
</html>
